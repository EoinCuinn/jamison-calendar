<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jamison Park – Facility Availability</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a2e}
#app{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
#sidebar{width:280px;min-width:220px;background:#1a1a2e;color:#e0e0e0;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
#sidebar h1{font-size:13px;font-weight:700;padding:14px 16px;border-bottom:1px solid #2d2d4e;background:#16213e;color:#7cc8f8;letter-spacing:.5px;text-transform:uppercase}
#sidebar-inner{overflow-y:auto;flex:1}
.cat-section{border-bottom:1px solid #2d2d4e}
.cat-header{display:flex;align-items:center;padding:10px 14px;cursor:pointer;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;background:#1e2840;border:none;width:100%;text-align:left;gap:8px;color:#aac4e0}
.cat-header:hover{background:#243050}
.cat-header input[type=checkbox]{accent-color:#7cc8f8;cursor:pointer}
.badge{margin-left:auto;background:#2d3a55;color:#7cc8f8;border-radius:10px;padding:1px 7px;font-size:10px}
.fac-list{display:none}
.fac-list.open{display:block}
.fac-item{display:flex;align-items:center;padding:7px 14px 7px 28px;font-size:12px;gap:8px;border-left:2px solid transparent}
.fac-item input[type=checkbox]{accent-color:#7cc8f8;flex-shrink:0;cursor:pointer}
.fac-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ccd6e8}

/* Main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}

/* Toolbar */
#toolbar{background:#fff;padding:12px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #dde3ee;box-shadow:0 1px 4px rgba(0,0,0,.06);flex-wrap:wrap}
#toolbar h2{font-size:15px;font-weight:700;color:#1a1a2e}
.btn{padding:6px 14px;border-radius:6px;border:1px solid #c8d0e0;background:#fff;cursor:pointer;font-size:13px;color:#444;font-family:inherit;transition:background .1s}
.btn:hover:not(:disabled){background:#f0f4ff}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:#1a6bc2;color:#fff;border-color:#1a6bc2}
.btn.primary:hover:not(:disabled){background:#1558a0}
#week-label{font-size:13px;font-weight:600;color:#333;min-width:210px;text-align:center}
.legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#555}
.dot{width:11px;height:11px;border-radius:3px}
.dot-free{background:#22c55e}
.dot-partial{background:#f59e0b}
.dot-booked{background:#ef4444}
.dot-prelim{background:#8b5cf6}
#data-note{font-size:11px;color:#888;margin-left:auto;white-space:nowrap}

/* Loading */
#loading-bar{height:3px;background:linear-gradient(90deg,#1a6bc2 0%,#7cc8f8 50%,#1a6bc2 100%);background-size:200%;animation:shimmer 1.2s infinite linear;display:none}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
#loading-overlay{display:none;position:absolute;inset:0;background:rgba(240,242,245,.75);z-index:50;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-size:13px;color:#555}
#loading-overlay.show{display:flex}
#loading-progress{font-size:12px;color:#888}

/* Error banner */
#error-banner{display:none;background:#fef2f2;border-bottom:1px solid #fecaca;padding:8px 20px;font-size:12px;color:#b91c1c;align-items:center;gap:8px}
#error-banner.show{display:flex}
#error-banner button{margin-left:auto;background:none;border:none;cursor:pointer;color:#b91c1c;font-size:18px;line-height:1}

/* Calendar */
#calendar-wrap{flex:1;overflow:auto;padding:16px}
#calendar{width:100%;border-collapse:collapse;min-width:700px}
#calendar thead th{background:#1a1a2e;color:#7cc8f8;padding:8px 6px;font-size:12px;font-weight:600;text-align:center;border:1px solid #2d2d4e;white-space:nowrap;position:sticky;top:0;z-index:10}
#calendar thead th.fac-col{text-align:left;min-width:200px;max-width:240px}
#calendar thead th.today-col{background:#1a4a7a;color:#fff}
#calendar tbody td{border:1px solid #e0e5ef;vertical-align:top;padding:3px}
#calendar tbody td.fac-cell{background:#fff;padding:6px 8px;font-size:12px;font-weight:500;max-width:240px;color:#1a1a2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-tag{font-size:10px;color:#888;display:block;margin-top:1px;font-weight:400}
#calendar tbody tr:hover td{background:#f7f9ff}
#calendar tbody tr:hover td.fac-cell{background:#eef2ff}
.cat-row td{background:#e8eef8!important;padding:4px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border:1px solid #d0d9e8}
.day-cell{min-height:40px;border-radius:4px;padding:2px}
.day-cell.free{background:#f0fff4}
.day-cell.partial{background:#fffbeb}
.day-cell.booked{background:#fff5f5}
.slot-bar{border-radius:3px;margin:2px 0;padding:2px 5px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default;line-height:1.5}
.slot-bar.avail{background:#22c55e;color:#fff}
.slot-bar.partial-slot{background:#f59e0b;color:#fff}
.slot-bar.full-slot{background:#ef4444;color:#fff}
.slot-bar.prelim-slot{background:#8b5cf6;color:#fff}
.free-label{font-size:10px;color:#16a34a;text-align:center;padding:10px 0;font-weight:500}

/* Tooltip */
#tooltip{position:fixed;background:#1a1a2e;color:#e0e0e0;padding:10px 13px;border-radius:8px;font-size:12px;max-width:280px;z-index:1000;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.35);line-height:1.7;display:none}
.tt-title{font-weight:700;color:#7cc8f8;margin-bottom:3px;font-size:13px}
.tt-ok{color:#4ade80}
.tt-no{color:#f87171}

/* Sidebar controls */
#sb-controls{padding:8px 14px;border-bottom:1px solid #2d2d4e;display:flex;gap:6px}
.sb-btn{padding:3px 10px;background:#1e2840;color:#aac4e0;border:1px solid #2d2d4e;border-radius:4px;font-size:11px;cursor:pointer;font-family:inherit}
.sb-btn:hover{background:#243050}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>&#127947; Jamison Park</h1>
    <div id="sb-controls">
      <button class="sb-btn" onclick="setAllSelected(true)">Select All</button>
      <button class="sb-btn" onclick="setAllSelected(false)">Clear All</button>
    </div>
    <div id="sidebar-inner"></div>
  </div>
  <div id="main">
    <div id="loading-bar"></div>
    <div id="error-banner">
      <span id="error-msg"></span>
      <button onclick="dismissError()" title="Dismiss">&#x2715;</button>
    </div>
    <div id="toolbar">
      <h2>Availability Calendar</h2>
      <button class="btn" id="btn-prev" onclick="navWeek(-1)">&#8592; Prev</button>
      <span id="week-label"></span>
      <button class="btn" id="btn-next" onclick="navWeek(1)">Next &#8594;</button>
      <button class="btn primary" onclick="goToday()">Today</button>
      <button class="btn" id="btn-refresh" onclick="loadData()">&#8635; Refresh</button>
      <div class="legend">
        <div class="legend-item"><div class="dot dot-free"></div>Open</div>
        <div class="legend-item"><div class="dot dot-partial"></div>Partial</div>
        <div class="legend-item"><div class="dot dot-booked"></div>Booked</div>
        <div class="legend-item"><div class="dot dot-prelim"></div>Tentative</div>
      </div>
      <span id="data-note">Loading&hellip;</span>
    </div>
    <div id="calendar-wrap">
      <table id="calendar">
        <thead id="cal-head"></thead>
        <tbody id="cal-body"></tbody>
      </table>
    </div>
    <div id="loading-overlay">
      <div>Fetching availability&hellip;</div>
      <div id="loading-progress"></div>
    </div>
  </div>
</div>
<div id="tooltip"></div>

<script>
'use strict';

// ── Config ────────────────────────────────────────────────────────────────────
const API_BASE         = '/proxy?path=';
const SALES_CHANNEL    = 5;
const BOOKING_TYPE     = 1;
const DAYS_AHEAD       = 28;
const REFRESH_MS       = 30 * 60 * 1000;  // 30 minutes
const FETCH_BATCH_SIZE = 10;               // parallel timeslot requests per batch

const CAT_ORDER  = {'Netball Court':0,'Sports Field':1,'Oval':2};
const CAT_COLORS = {'Netball Court':'#7cc8f8','Sports Field':'#4ade80','Oval':'#fb923c'};

// ── Global state ──────────────────────────────────────────────────────────────
let facilities  = [];
let selected    = new Set();
let catOpen     = {};
let weekStart   = getMonday(new Date());
let isLoading   = false;
let refreshTimer = null;
let abortCtrl   = null;

// ── Cleanup on unload ─────────────────────────────────────────────────────────
window.addEventListener('beforeunload', () => {
  if (refreshTimer) clearInterval(refreshTimer);
  if (abortCtrl)    abortCtrl.abort();
});

// ── API fetch helper ──────────────────────────────────────────────────────────
async function apiFetch(path, signal) {
  const res = await fetch(API_BASE + encodeURIComponent(path), {
    signal
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const wrapper = await res.json();
  return JSON.parse(wrapper.data);
}

// ── Main data load ────────────────────────────────────────────────────────────
async function loadData() {
  if (isLoading) return;
  isLoading = true;

  // Cancel any previous in-flight requests before starting fresh
  if (abortCtrl) abortCtrl.abort();
  abortCtrl = new AbortController();
  const signal = abortCtrl.signal;

  setLoading(true, 'Fetching facilities…');
  dismissError();

  try {
    // 1. Facility pages — all three in parallel
    const pages = await Promise.all(
      [1, 2, 3].map(p => apiFetch(
        'api/assets/invoke?id=100' +
        '&page.number=' + p + '&page.size=100' +
        '&assetSearchFilter.assetClassId=1' +
        '&assetSearchFilter.activeStatus=1' +
        '&assetSearchFilter.BookingTypeIds=' + BOOKING_TYPE +
        '&assetSearchFilter.saleschannelId=' + SALES_CHANNEL +
        '&include=venue',
        signal
      ))
    );
    const jFacs = pages.flatMap(p => p.data)
                       .filter(f => f.attributes.name.includes('Jamison'));

    // 2. Rolling 28-day window from today
    const today    = new Date();
    const fromDate = isoDate(today);
    const toDate   = isoDate(new Date(today.getTime() + DAYS_AHEAD * 86400000));

    // 3. Timeslots in batches of FETCH_BATCH_SIZE
    const slotMap = {};
    for (let i = 0; i < jFacs.length; i += FETCH_BATCH_SIZE) {
      if (signal.aborted) throw new DOMException('Aborted', 'AbortError');
      setLoading(true,
        'Fetching timeslots (' + Math.min(i + FETCH_BATCH_SIZE, jFacs.length) +
        ' / ' + jFacs.length + ')…'
      );
      const batch = jFacs.slice(i, i + FETCH_BATCH_SIZE);
      const results = await Promise.all(
        batch.map(f =>
          apiFetch(
            'api/assets/invoke?id=102' +
            '&timeSlotSearchFilter.FromDate=' + fromDate +
            '&timeSlotSearchFilter.ToDate='   + toDate +
            '&assetId=' + f.id,
            signal
          )
          .then(d  => ({ id: f.id, slots: d.data || [] }))
          .catch(() => ({ id: f.id, slots: [] }))   // one failure never kills the whole load
        )
      );
      results.forEach(r => { slotMap[r.id] = r.slots; });
    }

    // 4. Build the parsed facility list
    const prevSelected = new Set(selected);
    const isFirstLoad  = prevSelected.size === 0;

    facilities = jFacs.map(f => ({
      id:       f.id,
      name:     f.attributes.name.trim(),
      category: f.attributes.facilityCategory || 'Other',
      slots:    (slotMap[f.id] || []).map(s => ({
        start:       new Date(s.attributes.startTime),
        end:         new Date(s.attributes.endTime),
        available:   s.attributes.availableQuantity,
        capacity:    s.attributes.capacity,
        allocated:   s.attributes.allocatedQuantity,
        preliminary: s.attributes.preliminary
      }))
    })).sort((a, b) => {
      const ao = CAT_ORDER[a.category] !== undefined ? CAT_ORDER[a.category] : 9;
      const bo = CAT_ORDER[b.category] !== undefined ? CAT_ORDER[b.category] : 9;
      return ao !== bo ? ao - bo : a.name.localeCompare(b.name);
    });

    // Initialise selection and category state (preserved across refreshes)
    facilities.forEach(f => {
      if (isFirstLoad) selected.add(f.id);
      else if (prevSelected.has(f.id)) selected.add(f.id);
      if (catOpen[f.category] === undefined) catOpen[f.category] = true;
    });

    document.getElementById('data-note').textContent =
      'Updated ' +
      new Date().toLocaleTimeString('en-AU', {hour:'2-digit', minute:'2-digit'}) +
      ' · ' + fromDate + ' – ' + toDate;

    renderSidebar();
    renderCalendar();

  } catch (err) {
    if (err.name !== 'AbortError') {
      showError('Failed to load data: ' + err.message);
      console.error(err);
    }
  } finally {
    isLoading = false;
    setLoading(false, '');
  }
}

// ── Auto-refresh — single interval, replaced on each call ────────────────────
function scheduleRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(loadData, REFRESH_MS);
}

// ── Date helpers ──────────────────────────────────────────────────────────────
function isoDate(d) { return d.toISOString().split('T')[0]; }

function getMonday(d) {
  const dt = new Date(d); dt.setHours(0, 0, 0, 0);
  const day = dt.getDay();
  dt.setDate(dt.getDate() + (day === 0 ? -6 : 1 - day));
  return dt;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function fmtDate(d)    { return d.toLocaleDateString('en-AU', {weekday:'short', month:'short', day:'numeric'}); }
function fmtTime(d)    { return d.toLocaleTimeString('en-AU', {hour:'2-digit', minute:'2-digit', hour12:true}); }
function sameDay(a, b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function isToday(d)    { return sameDay(d, new Date()); }
function shortName(n)  { return n.replace(/Jamison Park\s*[-–]\s*/g, '').trim(); }

function getSlotsForDay(fac, date) {
  const s = new Date(date); s.setHours(0, 0, 0, 0);
  const e = new Date(date); e.setHours(23, 59, 59, 999);
  return fac.slots.filter(sl => sl.start < e && sl.end > s);
}
function dayStatus(fac, date) {
  const sl = getSlotsForDay(fac, date);
  if (!sl.length) return 'free';
  if (sl.every(s => s.available <= 0)) return 'booked';
  return 'partial';
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function setLoading(on, msg) {
  document.getElementById('loading-bar').style.display = on ? 'block' : 'none';
  document.getElementById('loading-overlay').classList.toggle('show', on);
  if (msg !== undefined) document.getElementById('loading-progress').textContent = msg;
  document.getElementById('btn-refresh').disabled = on;
  document.getElementById('btn-prev').disabled    = on;
  document.getElementById('btn-next').disabled    = on;
}
function showError(msg) {
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('error-banner').classList.add('show');
}
function dismissError() {
  document.getElementById('error-banner').classList.remove('show');
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function renderSidebar() {
  const inner = document.getElementById('sidebar-inner');
  inner.innerHTML = '';
  const cats = [...new Set(facilities.map(f => f.category))];

  cats.forEach(cat => {
    const facs  = facilities.filter(f => f.category === cat);
    const allOn = facs.every(f => selected.has(f.id));
    const anyOn = facs.some(f  => selected.has(f.id));

    const sec = document.createElement('div'); sec.className = 'cat-section';
    const hdr = document.createElement('button'); hdr.className = 'cat-header';
    const cb  = document.createElement('input'); cb.type = 'checkbox'; cb.checked = allOn; cb.indeterminate = anyOn && !allOn;
    cb.onclick = function(e) { e.stopPropagation(); toggleCat(cat, cb.checked); };
    const lbl = document.createElement('span'); lbl.style.color = CAT_COLORS[cat] || '#aac4e0'; lbl.textContent = cat;
    const bdg = document.createElement('span'); bdg.className = 'badge'; bdg.textContent = facs.length;
    const arr = document.createElement('span'); arr.style.cssText = 'margin-left:4px;font-size:10px'; arr.textContent = catOpen[cat] ? '▾' : '▸';
    hdr.append(cb, lbl, bdg, arr);
    hdr.onclick = function(e) { if (e.target === cb) return; catOpen[cat] = !catOpen[cat]; renderSidebar(); };
    sec.appendChild(hdr);

    const list = document.createElement('div'); list.className = 'fac-list' + (catOpen[cat] ? ' open' : '');
    facs.forEach(function(fac) {
      const item = document.createElement('div'); item.className = 'fac-item';
      const fcb  = document.createElement('input'); fcb.type = 'checkbox'; fcb.checked = selected.has(fac.id);
      fcb.onchange = function() {
        if (fcb.checked) selected.add(fac.id); else selected.delete(fac.id);
        renderSidebar(); renderCalendar();
      };
      const nm = document.createElement('span'); nm.className = 'fac-name'; nm.title = fac.name; nm.textContent = shortName(fac.name);
      item.append(fcb, nm); list.appendChild(item);
    });
    sec.appendChild(list); inner.appendChild(sec);
  });
}

function toggleCat(cat, on) {
  facilities.filter(f => f.category === cat).forEach(f => { if (on) selected.add(f.id); else selected.delete(f.id); });
  renderSidebar(); renderCalendar();
}
function setAllSelected(v) {
  facilities.forEach(f => { if (v) selected.add(f.id); else selected.delete(f.id); });
  renderSidebar(); renderCalendar();
}

// ── Navigation ────────────────────────────────────────────────────────────────
function navWeek(n) { weekStart = addDays(weekStart, n * 7); renderCalendar(); }
function goToday()  { weekStart = getMonday(new Date()); renderCalendar(); }

// ── Calendar render ───────────────────────────────────────────────────────────
function renderCalendar() {
  const head = document.getElementById('cal-head');
  const body = document.getElementById('cal-body');
  head.innerHTML = ''; body.innerHTML = '';

  const days = Array.from({length: 7}, function(_, i) { return addDays(weekStart, i); });
  document.getElementById('week-label').textContent = fmtDate(days[0]) + ' – ' + fmtDate(days[6]);

  // Header
  const hr = document.createElement('tr');
  const thF = document.createElement('th'); thF.className = 'fac-col'; thF.textContent = 'Facility'; hr.appendChild(thF);
  days.forEach(function(day) {
    const th = document.createElement('th');
    if (isToday(day)) th.className = 'today-col';
    th.innerHTML =
      day.toLocaleDateString('en-AU', {weekday:'short'}) + '<br>' +
      '<span style="font-size:15px;color:' + (isToday(day) ? '#fff' : '#b0c4de') + '">' + day.getDate() + '</span><br>' +
      '<span style="font-size:10px;font-weight:400">' + day.toLocaleDateString('en-AU', {month:'short'}) + '</span>';
    hr.appendChild(th);
  });
  head.appendChild(hr);

  const vis = facilities.filter(f => selected.has(f.id));
  if (!vis.length) {
    const tr = document.createElement('tr'); const td = document.createElement('td');
    td.colSpan = 8; td.style.cssText = 'text-align:center;padding:48px;color:#888;font-style:italic';
    td.textContent = facilities.length ? 'No facilities selected — use the sidebar.' : 'Loading…';
    tr.appendChild(td); body.appendChild(tr); return;
  }

  let lastCat = null;
  vis.forEach(function(fac) {
    if (fac.category !== lastCat) {
      lastCat = fac.category;
      const cr = document.createElement('tr'); cr.className = 'cat-row';
      const cd = document.createElement('td'); cd.colSpan = 8;
      cd.style.color = CAT_COLORS[fac.category] || '#4a5568';
      cd.textContent = fac.category; cr.appendChild(cd); body.appendChild(cr);
    }
    const tr  = document.createElement('tr');
    const tdF = document.createElement('td'); tdF.className = 'fac-cell';
    tdF.innerHTML = shortName(fac.name) + '<span class="cat-tag">08:00 – 22:00</span>';
    tr.appendChild(tdF);

    days.forEach(function(day) {
      const td   = document.createElement('td');
      const cell = document.createElement('div');
      const slots = getSlotsForDay(fac, day);
      cell.className = 'day-cell ' + dayStatus(fac, day);

      if (!slots.length) {
        cell.innerHTML = '<div class="free-label">✓ Open</div>';
      } else {
        slots.forEach(function(slot, idx) {
          const cls = slot.preliminary ? 'prelim-slot'
            : slot.available <= 0             ? 'full-slot'
            : slot.available < slot.capacity * 0.5 ? 'partial-slot'
            : 'avail';
          const bar = document.createElement('div');
          bar.className   = 'slot-bar ' + cls;
          bar.textContent = fmtTime(slot.start) + '–' + fmtTime(slot.end);
          // Store lookup keys for the delegated tooltip handler
          bar.dataset.facId   = fac.id;
          bar.dataset.slotIdx = fac.slots.indexOf(slot);
          cell.appendChild(bar);
        });
      }
      td.appendChild(cell); tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

// ── Tooltip — ONE delegated listener on the stable #cal-body element ──────────
// No per-bar listeners = no listener accumulation across re-renders.
(function() {
  const tip  = document.getElementById('tooltip');
  const body = document.getElementById('cal-body');

  body.addEventListener('mouseover', function(e) {
    const bar = e.target.closest('.slot-bar');
    if (!bar) { hideTip(); return; }
    const fac  = facilities.find(function(f) { return f.id === bar.dataset.facId; });
    const slot = fac && fac.slots[parseInt(bar.dataset.slotIdx, 10)];
    if (!fac || !slot) return;
    const avail = slot.available <= 0
      ? '<span class="tt-no">FULLY BOOKED</span>'
      : '<span class="tt-ok">' + slot.available + ' of ' + slot.capacity + ' remaining</span>';
    tip.innerHTML =
      '<div class="tt-title">' + fac.name + '</div>' +
      '<div>' + fmtTime(slot.start) + ' – ' + fmtTime(slot.end) + '</div>' +
      '<div>' + avail + (slot.preliminary ? ' <em>[Tentative]</em>' : '') + '</div>' +
      '<div style="color:#888;font-size:11px;margin-top:2px">Allocated: ' + slot.allocated + ' · Capacity: ' + slot.capacity + '</div>';
    tip.style.display = 'block';
  });

  body.addEventListener('mouseout', function(e) {
    if (!e.relatedTarget || !e.relatedTarget.closest('.slot-bar')) hideTip();
  });

  document.addEventListener('mousemove', function(e) {
    if (tip.style.display !== 'block') return;
    var x = e.clientX + 15, y = e.clientY - 10;
    if (x + 300 > window.innerWidth)  x = e.clientX - 315;
    if (y + 130 > window.innerHeight) y = e.clientY - 130;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });

  function hideTip() { tip.style.display = 'none'; }
}());

// ── Boot ──────────────────────────────────────────────────────────────────────
loadData().then(scheduleRefresh);
</script>
