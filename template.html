<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jamison Park – Facility Availability</title>
<style>
/* ── Reset & base ─────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a2e;overflow:hidden}

/* ── Layout shell ─────────────────────────────────────────────────────── */
#app{display:flex;height:100vh;overflow:hidden}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── Sidebar (desktop: persistent left column) ────────────────────────── */
#sidebar{
  width:280px;flex-shrink:0;
  background:#1a1a2e;color:#e0e0e0;
  display:flex;flex-direction:column;overflow:hidden;
  transition:transform .25s ease;
}
#sb-titlebar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;
  padding-top:calc(14px + env(safe-area-inset-top, 0px));
  border-bottom:1px solid #2d2d4e;background:#16213e;
}
#sb-titlebar h1{font-size:13px;font-weight:700;color:#7cc8f8;letter-spacing:.5px;text-transform:uppercase}
#drawer-close{display:none;background:none;border:none;color:#7cc8f8;font-size:20px;cursor:pointer;line-height:1;padding:0 2px}
#sb-controls{
  padding:8px 14px;border-bottom:1px solid #2d2d4e;
  display:flex;gap:6px;align-items:center;
}
#sb-controls span{font-size:11px;color:#556;margin-right:auto}
#sidebar-inner{overflow-y:auto;flex:1}
.cat-section{border-bottom:1px solid #2d2d4e}
.cat-header{
  display:flex;align-items:center;padding:10px 14px;cursor:pointer;
  font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;
  background:#1e2840;border:none;width:100%;text-align:left;gap:8px;color:#aac4e0;
}
.cat-header:hover{background:#243050}
.cat-header input[type=checkbox]{accent-color:#7cc8f8;cursor:pointer;flex-shrink:0}
.badge{margin-left:auto;background:#2d3a55;color:#7cc8f8;border-radius:10px;padding:1px 7px;font-size:10px;flex-shrink:0}
.cat-arrow{font-size:10px;flex-shrink:0}
.fac-list{display:none}
.fac-list.open{display:block}
.fac-item{display:flex;align-items:center;padding:7px 14px 7px 28px;font-size:12px;gap:8px}
.fac-item input[type=checkbox]{accent-color:#7cc8f8;flex-shrink:0;cursor:pointer}
.fac-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ccd6e8}
.sb-btn{
  padding:4px 10px;background:#1e2840;color:#aac4e0;
  border:1px solid #2d2d4e;border-radius:4px;font-size:11px;cursor:pointer;font-family:inherit;
}
.sb-btn:hover{background:#243050}

/* ── Backdrop (mobile only) ───────────────────────────────────────────── */
#backdrop{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.5);z-index:199;
}
#backdrop.show{display:block}

/* ── Toolbar ──────────────────────────────────────────────────────────── */
#toolbar{
  background:#fff;padding:10px 16px;
  padding-top:calc(10px + env(safe-area-inset-top, 0px));
  display:flex;align-items:center;flex-wrap:wrap;gap:8px;
  border-bottom:1px solid #dde3ee;box-shadow:0 1px 4px rgba(0,0,0,.06);
  flex-shrink:0;
}
#filter-btn{
  display:none; /* shown only on mobile */
  align-items:center;gap:6px;
  padding:6px 12px;border-radius:6px;border:1px solid #c8d0e0;
  background:#fff;cursor:pointer;font-size:13px;color:#444;font-family:inherit;
}
#filter-btn.filtered{border-color:#1a6bc2;color:#1a6bc2}
#filter-count{
  display:none;background:#1a6bc2;color:#fff;
  border-radius:10px;padding:0 6px;font-size:10px;font-weight:700;line-height:1.6;
}
#toolbar-title{font-size:15px;font-weight:700;color:#1a1a2e}
#nav-group{display:flex;align-items:center;gap:6px;margin-left:auto}
#week-label{font-size:13px;font-weight:600;color:#333;min-width:190px;text-align:center;white-space:nowrap}
.btn{
  padding:6px 12px;border-radius:6px;border:1px solid #c8d0e0;
  background:#fff;cursor:pointer;font-size:13px;color:#444;font-family:inherit;transition:background .1s;
  white-space:nowrap;
}
.btn:hover{background:#f0f4ff}
.btn.primary{background:#1a6bc2;color:#fff;border-color:#1a6bc2}
.btn.primary:hover{background:#1558a0}

/* ── Legend (compact single row) ─────────────────────────────────────── */
#legend{display:flex;gap:10px;align-items:center;flex-wrap:nowrap}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#555;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.dot-free{background:#22c55e}
.dot-partial{background:#f59e0b}
.dot-booked{background:#ef4444}
.dot-prelim{background:#8b5cf6}
#data-note{font-size:10px;color:#aaa;margin-left:auto;white-space:nowrap}

/* ── Calendar ─────────────────────────────────────────────────────────── */
#calendar-wrap{flex:1;overflow:auto;padding:0 0 calc(12px + env(safe-area-inset-bottom, 0px))}
#calendar{width:100%;border-collapse:collapse;min-width:600px}
#calendar thead th{
  background:#1a1a2e;color:#7cc8f8;padding:8px 5px;font-size:12px;font-weight:600;
  text-align:center;border:1px solid #2d2d4e;white-space:nowrap;
  position:sticky;top:0;z-index:10;
}
#calendar thead th.fac-col{text-align:left;min-width:140px}
#calendar thead th.today-col{background:#1a4a7a;color:#fff}
#calendar tbody td{border:1px solid #e0e5ef;vertical-align:top;padding:3px}
#calendar tbody td.fac-cell{
  background:#fff;padding:5px 7px;font-size:11px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;color:#1a1a2e;
}
.cat-tag{font-size:10px;color:#999;display:block;margin-top:1px;font-weight:400}
#calendar tbody tr:hover td{background:#f7f9ff}
#calendar tbody tr:hover td.fac-cell{background:#eef2ff}
.cat-row td{
  background:#e8eef8!important;padding:4px 10px;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  border:1px solid #d0d9e8;
}
.day-cell{min-height:36px;border-radius:3px;padding:2px}
.day-cell.free{background:#f0fff4}
.day-cell.partial{background:#fffbeb}
.day-cell.booked{background:#fff5f5}
.slot-bar{
  border-radius:3px;margin:2px 0;padding:2px 4px;
  font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:default;line-height:1.5;
}
.slot-bar.avail{background:#22c55e;color:#fff}
.slot-bar.partial-slot{background:#f59e0b;color:#fff}
.slot-bar.full-slot{background:#ef4444;color:#fff}
.slot-bar.prelim-slot{background:#8b5cf6;color:#fff}
.free-label{font-size:10px;color:#16a34a;text-align:center;padding:8px 0;font-weight:500}

/* ── Tooltip ──────────────────────────────────────────────────────────── */
#tooltip{
  position:fixed;background:#1a1a2e;color:#e0e0e0;
  padding:10px 13px;border-radius:8px;font-size:12px;max-width:280px;
  z-index:1000;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.35);
  line-height:1.7;display:none;
}
.tt-title{font-weight:700;color:#7cc8f8;margin-bottom:3px;font-size:13px}
.tt-ok{color:#4ade80}
.tt-no{color:#f87171}

/* ── Mobile overrides (<768px) ────────────────────────────────────────── */
@media(max-width:767px){
  /* Sidebar becomes fixed overlay drawer */
  #sidebar{
    position:fixed;top:0;left:0;height:100vh;
    width:min(85vw,300px);z-index:200;
    transform:translateX(-100%);
  }
  #sidebar.open{transform:translateX(0)}
  #drawer-close{display:block}

  /* Show filter button in toolbar */
  #filter-btn{display:flex}

  /* Toolbar layout: two visual rows via ordering */
  #toolbar{padding:8px 12px;gap:6px}
  #filter-btn{order:1}
  #toolbar-title{order:2;flex:1;font-size:14px}
  #btn-today{order:3}
  #nav-group{order:4;width:100%;margin-left:0;justify-content:center}
  #week-label{min-width:0;flex:1}
  #legend{order:5;width:100%;gap:8px}
  #data-note{display:none}

  /* Tighter calendar */
  #calendar-wrap{padding:8px}
  #calendar thead th.fac-col{min-width:90px}
  #calendar tbody td.fac-cell{max-width:90px;font-size:10px;padding:4px 5px}
  .cat-tag{display:none}
}
</style>
</head>
<body>

<!-- Mobile backdrop -->
<div id="backdrop" onclick="closeDrawer()"></div>

<div id="app">
  <!-- ── Sidebar / Filter Drawer ─────────────────────────────────────── -->
  <div id="sidebar">
    <div id="sb-titlebar">
      <h1>&#127947; Jamison Park</h1>
      <button id="drawer-close" onclick="closeDrawer()" title="Close">&#x2715;</button>
    </div>
    <div id="sb-controls">
      <button class="sb-btn" onclick="setAllSelected(true)">Select All</button>
      <button class="sb-btn" onclick="setAllSelected(false)">Clear All</button>
    </div>
    <div id="sidebar-inner"></div>
  </div>

  <!-- ── Main content ───────────────────────────────────────────────── -->
  <div id="main">
    <div id="toolbar">
      <!-- Filter toggle (mobile only) -->
      <button id="filter-btn" onclick="openDrawer()">
        <span>&#9776; Filters</span>
        <span id="filter-count"></span>
      </button>

      <span id="toolbar-title">Availability Calendar</span>

      <button class="btn primary" id="btn-today" onclick="goToday()">Today</button>

      <div id="nav-group">
        <button class="btn" onclick="navWeek(-1)">&#8592; Prev</button>
        <span id="week-label"></span>
        <button class="btn" onclick="navWeek(1)">Next &#8594;</button>
      </div>

      <div id="legend">
        <div class="legend-item"><div class="dot dot-free"></div>Open</div>
        <div class="legend-item"><div class="dot dot-partial"></div>Partial</div>
        <div class="legend-item"><div class="dot dot-booked"></div>Booked</div>
        <div class="legend-item"><div class="dot dot-prelim"></div>Tentative</div>
      </div>

      <span id="data-note">Updated __GENERATED_AT__</span>
    </div>

    <div id="calendar-wrap">
      <table id="calendar">
        <thead id="cal-head"></thead>
        <tbody id="cal-body"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="tooltip"></div>

<script>
'use strict';

const RAW = __DATA_PLACEHOLDER__;

const CAT_ORDER  = {'Netball Court':0,'Sports Field':1,'Oval':2};
const CAT_COLORS = {'Netball Court':'#7cc8f8','Sports Field':'#4ade80','Oval':'#fb923c'};

const facilities = Object.values(RAW).map(f => ({
  id:       f.id,
  name:     f.name,
  category: f.category || 'Other',
  slots:    (f.slots || []).map(s => ({
    start:       new Date(s.start),
    end:         new Date(s.end),
    available:   s.available,
    capacity:    s.capacity,
    allocated:   s.allocated,
    preliminary: s.preliminary
  }))
})).sort((a, b) => {
  const ao = CAT_ORDER[a.category] !== undefined ? CAT_ORDER[a.category] : 9;
  const bo = CAT_ORDER[b.category] !== undefined ? CAT_ORDER[b.category] : 9;
  return ao !== bo ? ao - bo : a.name.localeCompare(b.name);
});

const isMobile = () => window.matchMedia('(max-width: 767px)').matches;

// On mobile: categories collapsed by default
let selected  = new Set(facilities.map(f => f.id));
let catOpen   = Object.fromEntries([...new Set(facilities.map(f => f.category))].map(c => [c, !isMobile()]));
let weekStart = getMonday(new Date());

// ── Drawer ────────────────────────────────────────────────────────────────
function openDrawer() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('backdrop').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeDrawer() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
  document.body.style.overflow = '';
}

// Close drawer on resize to desktop
window.addEventListener('resize', function() {
  if (!isMobile()) closeDrawer();
});

// ── Filter badge ──────────────────────────────────────────────────────────
function updateFilterBadge() {
  const count = selected.size;
  const total = facilities.length;
  const btn   = document.getElementById('filter-btn');
  const badge = document.getElementById('filter-count');
  if (count === total) {
    badge.style.display = 'none';
    btn.classList.remove('filtered');
  } else {
    badge.textContent  = count + ' / ' + total;
    badge.style.display = 'inline';
    btn.classList.add('filtered');
  }
}

// ── Date helpers ──────────────────────────────────────────────────────────
function getMonday(d) {
  const dt = new Date(d); dt.setHours(0,0,0,0);
  const day = dt.getDay();
  dt.setDate(dt.getDate() + (day === 0 ? -6 : 1 - day));
  return dt;
}
function addDays(d, n)  { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function fmtDate(d)     { return d.toLocaleDateString('en-AU', {weekday:'short', month:'short', day:'numeric'}); }
function fmtTime(d)     { return d.toLocaleTimeString('en-AU', {hour:'2-digit', minute:'2-digit', hour12:true}); }
function sameDay(a, b)  { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function isToday(d)     { return sameDay(d, new Date()); }
function shortName(n)   { return n.replace(/Jamison Park\s*[-–]\s*/g, '').trim(); }

function getSlotsForDay(fac, date) {
  const s = new Date(date); s.setHours(0,0,0,0);
  const e = new Date(date); e.setHours(23,59,59,999);
  return fac.slots.filter(sl => sl.start < e && sl.end > s);
}
function dayStatus(fac, date) {
  const sl = getSlotsForDay(fac, date);
  if (!sl.length) return 'free';
  if (sl.every(s => s.available <= 0)) return 'booked';
  return 'partial';
}

// ── Sidebar ───────────────────────────────────────────────────────────────
function renderSidebar() {
  const inner = document.getElementById('sidebar-inner');
  inner.innerHTML = '';
  const cats = [...new Set(facilities.map(f => f.category))];
  cats.forEach(function(cat) {
    const facs  = facilities.filter(f => f.category === cat);
    const allOn = facs.every(f => selected.has(f.id));
    const anyOn = facs.some(f  => selected.has(f.id));

    const sec = document.createElement('div'); sec.className = 'cat-section';
    const hdr = document.createElement('button'); hdr.className = 'cat-header';

    const cb  = document.createElement('input'); cb.type = 'checkbox'; cb.checked = allOn; cb.indeterminate = anyOn && !allOn;
    cb.onclick = function(e) { e.stopPropagation(); toggleCat(cat, cb.checked); };

    const lbl = document.createElement('span'); lbl.style.color = CAT_COLORS[cat] || '#aac4e0'; lbl.textContent = cat;
    const bdg = document.createElement('span'); bdg.className = 'badge'; bdg.textContent = facs.length;
    const arr = document.createElement('span'); arr.className = 'cat-arrow'; arr.textContent = catOpen[cat] ? '▾' : '▸';

    hdr.append(cb, lbl, bdg, arr);
    hdr.onclick = function(e) {
      if (e.target === cb) return;
      catOpen[cat] = !catOpen[cat];
      renderSidebar();
    };
    sec.appendChild(hdr);

    const list = document.createElement('div');
    list.className = 'fac-list' + (catOpen[cat] ? ' open' : '');
    facs.forEach(function(fac) {
      const item = document.createElement('div'); item.className = 'fac-item';
      const fcb  = document.createElement('input'); fcb.type = 'checkbox'; fcb.checked = selected.has(fac.id);
      fcb.onchange = function() {
        if (fcb.checked) selected.add(fac.id); else selected.delete(fac.id);
        updateFilterBadge();
        renderSidebar();
        renderCalendar();
      };
      const nm = document.createElement('span'); nm.className = 'fac-name'; nm.title = fac.name; nm.textContent = shortName(fac.name);
      item.append(fcb, nm);
      list.appendChild(item);
    });
    sec.appendChild(list);
    inner.appendChild(sec);
  });
}

function toggleCat(cat, on) {
  facilities.filter(f => f.category === cat).forEach(f => { if (on) selected.add(f.id); else selected.delete(f.id); });
  updateFilterBadge(); renderSidebar(); renderCalendar();
}
function setAllSelected(v) {
  facilities.forEach(f => { if (v) selected.add(f.id); else selected.delete(f.id); });
  updateFilterBadge(); renderSidebar(); renderCalendar();
}

// ── Navigation ────────────────────────────────────────────────────────────
function navWeek(n) { weekStart = addDays(weekStart, n * 7); renderCalendar(); }
function goToday()  { weekStart = getMonday(new Date()); renderCalendar(); }

// ── Calendar ──────────────────────────────────────────────────────────────
function renderCalendar() {
  const head = document.getElementById('cal-head');
  const body = document.getElementById('cal-body');
  head.innerHTML = ''; body.innerHTML = '';

  const days = Array.from({length: 7}, function(_, i) { return addDays(weekStart, i); });
  document.getElementById('week-label').textContent = fmtDate(days[0]) + ' – ' + fmtDate(days[6]);

  // Header row
  const hr  = document.createElement('tr');
  const thF = document.createElement('th'); thF.className = 'fac-col'; thF.textContent = 'Facility'; hr.appendChild(thF);
  days.forEach(function(day) {
    const th = document.createElement('th');
    if (isToday(day)) th.className = 'today-col';
    th.innerHTML =
      day.toLocaleDateString('en-AU', {weekday:'short'}) + '<br>' +
      '<span style="font-size:15px;color:' + (isToday(day) ? '#fff' : '#b0c4de') + '">' + day.getDate() + '</span><br>' +
      '<span style="font-size:10px;font-weight:400">' + day.toLocaleDateString('en-AU', {month:'short'}) + '</span>';
    hr.appendChild(th);
  });
  head.appendChild(hr);

  const vis = facilities.filter(f => selected.has(f.id));
  if (!vis.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 8; td.style.cssText = 'text-align:center;padding:48px;color:#888;font-style:italic';
    td.textContent = 'No facilities selected — use the filter.';
    tr.appendChild(td); body.appendChild(tr); return;
  }

  let lastCat = null;
  vis.forEach(function(fac) {
    // Category separator row
    if (fac.category !== lastCat) {
      lastCat = fac.category;
      const cr = document.createElement('tr'); cr.className = 'cat-row';
      const cd = document.createElement('td'); cd.colSpan = 8;
      cd.style.color = CAT_COLORS[fac.category] || '#4a5568';
      cd.textContent = fac.category;
      cr.appendChild(cd); body.appendChild(cr);
    }
    const tr  = document.createElement('tr');
    const tdF = document.createElement('td'); tdF.className = 'fac-cell';
    tdF.innerHTML = shortName(fac.name) + '<span class="cat-tag">08:00 – 22:00</span>';
    tr.appendChild(tdF);

    days.forEach(function(day) {
      const td   = document.createElement('td');
      const cell = document.createElement('div');
      const slots = getSlotsForDay(fac, day);
      cell.className = 'day-cell ' + dayStatus(fac, day);
      if (!slots.length) {
        cell.innerHTML = '<div class="free-label">&#10003; Open</div>';
      } else {
        slots.forEach(function(slot) {
          const cls = slot.preliminary        ? 'prelim-slot'
            : slot.available <= 0             ? 'full-slot'
            : slot.available < slot.capacity * 0.5 ? 'partial-slot'
            : 'avail';
          const bar = document.createElement('div');
          bar.className    = 'slot-bar ' + cls;
          bar.textContent  = fmtTime(slot.start) + '–' + fmtTime(slot.end);
          bar.dataset.facId   = fac.id;
          bar.dataset.slotIdx = fac.slots.indexOf(slot);
          cell.appendChild(bar);
        });
      }
      td.appendChild(cell); tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

// ── Tooltip — single delegated listener ───────────────────────────────────
(function() {
  const tip  = document.getElementById('tooltip');
  const body = document.getElementById('cal-body');

  body.addEventListener('mouseover', function(e) {
    const bar = e.target.closest('.slot-bar');
    if (!bar) { tip.style.display = 'none'; return; }
    const fac  = facilities.find(function(f) { return f.id === bar.dataset.facId; });
    const slot = fac && fac.slots[parseInt(bar.dataset.slotIdx, 10)];
    if (!fac || !slot) return;
    const avail = slot.available <= 0
      ? '<span class="tt-no">FULLY BOOKED</span>'
      : '<span class="tt-ok">' + slot.available + ' of ' + slot.capacity + ' remaining</span>';
    tip.innerHTML =
      '<div class="tt-title">' + fac.name + '</div>' +
      '<div>' + fmtTime(slot.start) + ' – ' + fmtTime(slot.end) + '</div>' +
      '<div>' + avail + (slot.preliminary ? ' <em>[Tentative]</em>' : '') + '</div>' +
      '<div style="color:#888;font-size:11px;margin-top:2px">Allocated: ' + slot.allocated + ' &middot; Capacity: ' + slot.capacity + '</div>';
    tip.style.display = 'block';
  });

  body.addEventListener('mouseout', function(e) {
    if (!e.relatedTarget || !e.relatedTarget.closest('.slot-bar')) tip.style.display = 'none';
  });

  document.addEventListener('mousemove', function(e) {
    if (tip.style.display !== 'block') return;
    var x = e.clientX + 15, y = e.clientY - 10;
    if (x + 300 > window.innerWidth)  x = e.clientX - 315;
    if (y + 130 > window.innerHeight) y = e.clientY - 130;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
}());

// ── Init ──────────────────────────────────────────────────────────────────
updateFilterBadge();
renderSidebar();
renderCalendar();
</script>
</body>
</html>
